          +    public static int ApplyKoreanItemNames(GameInstallation game, CatalogDocument document)
          +    {
          +        var tags = new Dictionary<string, string>(StringComparer.OrdinalIgnoreCase);
          +        foreach (var archive in GameLocator.GetInstalledArchives(game))
          +        {
          +            if (archive.TextPath is not { } englishPath) continue;
          +            var directory = Path.GetDirectoryName(englishPath);
          +            if (string.IsNullOrEmpty(directory)) continue;
          +            var koreanPath = Path.Combine(directory, "Text_KO.arc");
          +            if (!File.Exists(koreanPath)) continue;
