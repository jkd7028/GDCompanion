          +            Reply(pipe, response); return;
          +        }
                   if (strcmp(line, "MINIMAP\tBOUNDS") == 0)
                   {
                       std::array<float, 6> bounds{};
          '@
          $patchPath = Join-Path $env:RUNNER_TEMP 'gdcompanion-1312-diag.patch'
          [System.IO.File]::WriteAllText($patchPath, $diagnosticPatch + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
          git apply --check $patchPath
