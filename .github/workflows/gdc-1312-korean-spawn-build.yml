                   if (!available || !currentMap || !currentOffset) return false;
                   __try
                   {
                       const auto map = static_cast<const unsigned char*>(currentMap);
          -            if (Field<void*>(map, 0) != executable + mapVtableRva || !Field<unsigned char>(map, 0x161) ||
          -                Field<int>(map, 0x38) == 2) return false; // The native render skips mode 2 (closed).
          +            const auto actualVtable = Field<void*>(map, 0);
          +            observedVtableRva.store(reinterpret_cast<uintptr_t>(actualVtable) -
          +                reinterpret_cast<uintptr_t>(executable), std::memory_order_relaxed);
          +            if (actualVtable != executable + mapVtableRva)
          +            { sampleStage.store(2, std::memory_order_relaxed); return false; }
          +            const auto visible = Field<unsigned char>(map, 0x161);
          +            observedVisible.store(visible, std::memory_order_relaxed);
          +            if (!visible) { sampleStage.store(3, std::memory_order_relaxed); return false; }
          +            const auto mode = Field<int>(map, 0x38);
          +            observedMode.store(mode, std::memory_order_relaxed);
          +            if (mode == 2) { sampleStage.store(4, std::memory_order_relaxed); return false; }
                       auto region = Field<void*>(map, 0x1C0);
          +            observedRegion.store(region != nullptr, std::memory_order_relaxed);
                       auto camera = map + 0x170;
                       auto viewport = map + 0x1C8;
          -            if (!region || Field<int>(camera, 0) != 1) return false; // Orthographic only.
          +            if (!region) { sampleStage.store(5, std::memory_order_relaxed); return false; }
          +            const auto cameraMode = Field<int>(camera, 0);
          +            observedCameraMode.store(cameraMode, std::memory_order_relaxed);
          +            if (cameraMode != 1) { sampleStage.store(6, std::memory_order_relaxed); return false; }
                       float origin[3] = { Field<float>(camera, 0x28), 0, Field<float>(camera, 0x30) };
                       float xPoint[3] = { origin[0] + 16, 0, origin[2] };
                       float zPoint[3] = { origin[0], 0, origin[2] + 16 };
          @@ -119,13 +144,16 @@ namespace MinimapProjection
                           (p[1] + Field<float>(map, 0xAC8) + currentOffset[1] + canvasY - top - radius) / radius,
                           (x[0] - p[0]) / (16 * radius), (x[1] - p[1]) / (16 * radius),
                           (z[0] - p[0]) / (16 * radius), (z[1] - p[1]) / (16 * radius) };
          -            for (auto value : result) if (!std::isfinite(value)) return false;
          +            for (auto value : result) if (!std::isfinite(value))
          +            { sampleStage.store(7, std::memory_order_relaxed); return false; }
                       const float xs = hypotf(result[4], result[5]), zs = hypotf(result[6], result[7]);
                       const bool valid = xs >= .001f && xs <= 1 && zs >= .001f && zs <= 1 &&
                           fabsf(xs - zs) < xs * .02f && fabsf(result[4] * result[6] + result[5] * result[7]) < xs * zs * .02f &&
                           fabsf(result[2]) < 2 && fabsf(result[3]) < 2;
          +            sampleStage.store(valid ? 10 : 8, std::memory_order_relaxed);
                       return valid;
                   }
          -        __except (EXCEPTION_EXECUTE_HANDLER) { return false; }
          +        __except (EXCEPTION_EXECUTE_HANDLER)
          +        { sampleStage.store(9, std::memory_order_relaxed); return false; }
               }
           }
          diff --git a/src/GrimDawnBridge/MinimapTelemetry.h b/src/GrimDawnBridge/MinimapTelemetry.h
          index 725949d..258ee69 100644
          --- a/src/GrimDawnBridge/MinimapTelemetry.h
          +++ b/src/GrimDawnBridge/MinimapTelemetry.h
          @@ -31,6 +31,8 @@ namespace MinimapTelemetry
